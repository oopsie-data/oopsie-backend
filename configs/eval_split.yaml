# Eval split and annotation bundle stages. Outputs go to <data_dir>/annotation/.
# The chosen proposal, the train sample and the first assignments are written once:
# later runs keep them and fail if the settings they were made from changed. Delete
# an output (and its .inputs record) to regenerate it. Bundles are never regenerated.

# Extra arguments for `oopsie splits propose`, e.g. pins:
#   ["--ood-common", "LAB", "--od-task", "LAB::instruction"]
# --train-only LAB keeps a lab out of every eval split.
propose_args:
  - --train-only=UT_RobIn
  - --train-only=Berkeley_RAIL
  - --train-only=UofT_TISL
  - --eval-budget=2000
  - --split-weights=0.5,0.5,0
  - --num-ood-common=0
  - --num-ood-custom=0
  - --num-od-tasks=58
  - --od-tasks-per-lab=5
  - --holdout-task-cap=20
  - --od-task-min-episodes=10
  - --no-od-task-spread

# Proposal id from proposals/REPORT.md to hold out; null until one is chosen.
chosen_proposal: configs/eval_proposal.json

train_sample:
  num_episodes: 1000

assignments:
  annotators_file: annotators.txt   # one name per line, in <data_dir>/annotation/
  seed: 0
  # copies and split_copies apply only to the first assignment of the eval split and
  # the train sample to the annotators listed at that time.
  eval:
    copies: 3
    split_copies: {od_task_od_scene: 3}
  train:
