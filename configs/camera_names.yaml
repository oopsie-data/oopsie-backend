# Unified camera names. Read by oopsie_backend.index.camera_names, which writes `unified_cameras`
# (source camera -> unified name) and `camera_name_issues` to the episode index.
#
# A unified name is one of `names`, optionally followed by `_2`, `_3`, ... for a further camera of
# the same placement and by `_stereo` for the second image of a stereo pair (exterior_side_2_stereo).
# `null` leaves a camera out (infrared); `unknown` leaves it out and reports it as an issue.
# A camera is looked up in `datasets.<dataset>.robots.<robot_name>`, then in `datasets.<dataset>`,
# then in `biarm_aliases` for bimanual episodes, then in `aliases`. In a single-arm episode, a lone
# wrist_left or wrist_right becomes wrist.

names:
  - wrist            # on the end effector; wrist_left / wrist_right on bimanual robots
  - wrist_left
  - wrist_right
  - head             # on the robot body or the operator: head, chest, torso, ego cameras
  - exterior_front   # static, facing the robot across the workspace
  - exterior_side    # static, from the side of the workspace
  - exterior_top     # static, looking down onto the workspace
  - exterior_back    # static, behind the robot, looking over it
  - tactile          # image of a visuotactile sensor, not a camera view

aliases:
  wrist: wrist
  wrist_cam: wrist
  wrist_image: wrist
  wrist_image_left: wrist_left
  wrist_view: wrist
