# Annotation distribution over Hugging Face; read by oopsie_backend.annotation.pipeline.
# Relative paths resolve against <data_dir>/annotation, next to the mirror's
# OopsieData-Submissions folder, so every run sees the same assignments, bundles,
# returns and stores. --data-dir and --index override the values below.
repo_id: OopsieData-Submissions/oopsie-annotation
data_dir: /corral/utexas/IRI26024/oopsiedata
index: /corral/utexas/IRI26024/episode_index/episode_index.parquet
stage_dir: annotation_repo
returns_dir: returns

batches:
  batch_1:
    assignment_dir: eval_assignment
    store: eval_annotations.jsonl
    release_dir: eval_release
  batch_2:
    assignment_dir: train_assignment
    store: train_annotations.jsonl
    release_dir: train_release
