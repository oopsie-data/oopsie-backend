# Unified arm and end effector names. Read by oopsie_backend.index.embodiments, which writes
# `unified_arm`, `unified_end_effector`, `end_effector_type`, `embodiment` and `embodiment_issues`
# to the episode index.
#
# A recorded robot_name is looked up in `datasets.<dataset>.arm_aliases`, then in `arm_aliases`;
# a recorded name that is itself one of `arms` maps to itself. gripper_name works the same way
# with `end_effector_aliases` and `end_effectors`. A list of two arms names a mixed bimanual setup
# (left, right). `unknown` keeps the episode's embodiment unnamed and reports it as an issue.
# Single-arm, bimanual and mobile setups are told apart by the index's `biarm` and
# `uses_mobile_base` columns, so arm names only name the arm model.

