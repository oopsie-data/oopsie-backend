[project]
name = "oopsie-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "oopsie-tools",
    "tqdm>=4.0",
    "huggingface-hub",
    "gsutil>=5.37",
    "tensorflow-datasets>=4.9.10",
    "tensorflow>=2.21.0",
    "numpy<2.4",
    "pyarrow>=15,<26",
]

[project.optional-dependencies]
# Install exactly one runtime extra. Both expose the same ``onnxruntime``
# module, so CPU and GPU extras are intentionally separate.
face-blur = [
    "deface==1.5.0",
    "imageio-ffmpeg>=0.6,<1",
    "onnx>=1.19,<2",
    "onnxruntime>=1.23,<2",
]
face-blur-gpu = [
    "deface==1.5.0",
    "imageio-ffmpeg>=0.6,<1",
    "onnx>=1.19,<2",
    "onnxruntime-gpu[cuda,cudnn]>=1.23,<2",
]
face-verify-qwen = [
    "accelerate>=1,<2",
    "pillow>=10,<13",
    "torch>=2.6,<3",
    "transformers>=5.1,<6",
]

[tool.uv.sources]
oopsie-tools = { path = "../oopsie-tools", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oopsie_backend"]
