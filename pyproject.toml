[project]
name = "oopsie-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "oopsie-data-tools",
    "tqdm>=4.0",
    "huggingface-hub",
    "gsutil>=5.37",
    "tensorflow-datasets>=4.9.10",
    "tensorflow>=2.21.0",
    "numpy<2.4",
    "matplotlib>=3.11.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "polars>=2.0.0",
    "pyarrow>=24.0.0",
    "apache-hamilton>=1.90.0",
]

[project.scripts]
oopsie = "oopsie_backend.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oopsie_backend"]
